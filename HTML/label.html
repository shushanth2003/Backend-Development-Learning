<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label</title>
</head>
<body>
    <div class="preference">
        <label for="cheese">I Like Cheese</label>
        <input type="checkbox" class="cheese" id="cheese">
    </div>
    <div class="preference">
        <label for="peas">I Like Peas</label>
        <input type="checkbox" class="peas" id="peas">
    </div>
</body>
</html>
